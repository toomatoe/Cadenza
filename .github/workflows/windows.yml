name: Windows native build
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify installed Rust toolchain
        shell: pwsh
        run: rustup update stable
      - name: Test, build and package
        shell: pwsh
        env:
          BUILD_REF: ${{ github.ref }}
          BUILD_TAG: ${{ github.ref_name }}
        run: |
          if ($env:BUILD_REF.StartsWith('refs/tags/')) {
            if ($env:BUILD_TAG -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$') { throw 'Use a version tag such as v0.1.0 or v0.1.0-beta.1.' }
            ./build.ps1 -Publish -Version $env:BUILD_TAG.Substring(1)
          } else {
            ./build.ps1 -Publish
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Cadenza-windows-x64
          path: |
            artifacts/Cadenza-windows-x64.zip
            artifacts/Cadenza-windows-x64.zip.sha256
          if-no-files-found: error

  release:
    name: Publish Windows download
    needs: windows
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Cadenza-windows-x64
          path: download
      - name: Attach downloads and publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = 'download/Cadenza-windows-x64.zip'
          $checksumFile = "$archive.sha256"
          $expectedHash = ((Get-Content -LiteralPath $checksumFile -Raw).Trim() -split '\s+')[0]
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ine $expectedHash) { throw 'Download checksum mismatch.' }
          $isPrerelease = $env:RELEASE_TAG.Contains('-')
          $releaseDraft = & gh release view $env:RELEASE_TAG --json isDraft --jq '.isDraft' 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ($releaseDraft -ne 'true') { throw 'This release is already published. Use a new version tag instead of replacing public downloads.' }
          } else {
            $createArguments = @('release', 'create', $env:RELEASE_TAG, '--verify-tag', '--draft', '--generate-notes', '--title', "Cadenza $env:RELEASE_TAG")
            if ($isPrerelease) { $createArguments += '--prerelease' }
            & gh @createArguments
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the draft release.' }
          }
          & gh release upload $env:RELEASE_TAG $archive $checksumFile --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not attach downloads. The release remains a draft.' }
          $latest = if ($isPrerelease) { 'false' } else { 'true' }
          & gh release edit $env:RELEASE_TAG --draft=false "--prerelease=$($isPrerelease.ToString().ToLowerInvariant())" "--latest=$latest"
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the release.' }
