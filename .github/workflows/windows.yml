name: Windows native build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify installed Rust toolchain
        shell: pwsh
        run: rustup update stable
      - name: Test, build and package
        shell: pwsh
        run: ./build.ps1 -Publish
      - uses: actions/upload-artifact@v4
        with:
          name: Cadenza-windows-x64
          path: artifacts/Cadenza-windows-x64.zip
          if-no-files-found: error
